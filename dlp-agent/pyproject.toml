[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-agent"
version = "0.1.0"
description = "DLP endpoint agent: watches folders and removable drives, scans through the platform, quarantines blocked files."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8"]

[project.scripts]
dlp-agent = "dlp_agent.cli:main"

[tool.setuptools.packages.find]
include = ["dlp_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
