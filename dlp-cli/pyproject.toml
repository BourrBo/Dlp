[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-cli"
version = "0.1.0"
description = "Offline data-loss-prevention scanner for developers: staged diffs, paths and git ranges."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
dlp = "dlp_cli.cli:main"

[tool.setuptools.packages.find]
include = ["dlp_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
