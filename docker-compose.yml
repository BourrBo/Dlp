services:
  backend:
    build:
      context: ./dlp-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env}
      DLP_ADMIN_API_KEY: ${DLP_ADMIN_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GMAIL_PUBSUB_SUBSCRIPTION_ID: ${GMAIL_PUBSUB_SUBSCRIPTION_ID:-}
      DLP_BACKEND_BASE_URL: ${DLP_BACKEND_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dlp-Frontend
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
