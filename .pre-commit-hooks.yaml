# Hooks published by this repository for https://pre-commit.com
- id: dlp-scan
  name: DLP scan (staged changes)
  description: Block commits that add secrets or personal data. Offline; scans only the lines being committed.
  entry: dlp scan --staged --quiet
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
